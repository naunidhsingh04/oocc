[tool.uv.workspace]
members = [
  "apps/api",
  "services/executor",
  "packages/contracts/python",
  "fixtures/generator",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Generated code (docstrings copied verbatim from JSON Schema descriptions,
# formatting dictated by datamodel-code-generator) is never hand-edited and
# never fought over stylistically — see packages/contracts/README.md.
extend-exclude = ["**/generated/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's dependency injection idiom is `Depends(...)` as an argument
# default — that's the framework's intended usage, not the mutable-default
# footgun B008 exists to catch.
"apps/api/app/routers/*.py" = ["B008"]
