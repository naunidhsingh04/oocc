[project]
name = "oocc-cpp-executor"
version = "0.1.0"
description = "OOCC C++ engine — Clang source-to-source instrumentation pass + wasi-sdk compile wrapper. docs/PRD.md §3.5."
requires-python = ">=3.12"
dependencies = [
    "libclang>=18.1.1",
]

[tool.uv.sources]
oocc-contracts = { workspace = true }

[dependency-groups]
dev = [
    "oocc-contracts",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
strict = true

# libclang's Python bindings (clang.cindex) ship no type stubs and no
# py.typed marker, and no types-libclang package exists on PyPI to supply
# them — this is a real, permanent gap in the library, not something to
# work around by hand-writing full stubs for a third-party C API wrapper.
[[tool.mypy.overrides]]
module = ["clang", "clang.*"]
ignore_missing_imports = true
