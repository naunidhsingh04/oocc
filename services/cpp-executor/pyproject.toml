[project]
name = "oocc-cpp-executor"
version = "0.1.0"
description = "OOCC C++ engine — Clang source-to-source instrumentation pass + wasi-sdk compile wrapper. docs/PRD.md §3.5."
requires-python = ">=3.12"
dependencies = [
    "libclang>=18.1.1",
]

[tool.uv.sources]
oocc-contracts = { workspace = true }

[dependency-groups]
dev = [
    "oocc-contracts",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
