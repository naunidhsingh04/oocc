# Fly.io deploy config for the Next.js web app. Deploy from the repo root:
# `fly deploy --config apps/web/fly.toml --dockerfile apps/web/Dockerfile`.
app = "oocc-web"
primary_region = "iad"

[build]
  dockerfile = "apps/web/Dockerfile"

[env]
  PORT = "3000"
  NODE_ENV = "production"
  # NEXT_PUBLIC_API_URL is baked in at build time (Next.js inlines
  # NEXT_PUBLIC_* at build, not read at runtime) — pass it as a build arg,
  # not a runtime [env]/secret. See docs/RUNBOOK.md's deploy section.

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "suspend"  # static/RSC-heavy traffic tolerates cold starts; the API doesn't
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    path = "/"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
