[project]
name = "oocc-api"
version = "0.1.0"
description = "OOCC API — FastAPI app. docs/PRD.md §2."
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi>=0.140.0",
    "google-genai>=2.14.0",
    "httpx2>=2.9.1",
    "langgraph>=1.2.9",
    "oocc-contracts",
    "pgvector>=0.5.0",
    "pydantic-settings>=2.14.2",
    "redis>=8.0.1",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.51.0",
]

[tool.uv.sources]
oocc-contracts = { workspace = true }
oocc-executor = { workspace = true }

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "oocc-executor",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
